_version = 1

[workflow]
graph = "workflow.fabro"

# Mirrors the graph goal so `fabro workflow list` shows a description.
# Goal precedence is CLI --goal > [run].goal > graph attribute, so this must
# stay identical to the graph's goal= attribute.
[run]
goal = "Set up the Facto mechanics: put the task-* worktree commands on the shell PATH, then optionally wire this repo to a GitHub Issues and Project tracker and drop worktree hook stubs"
