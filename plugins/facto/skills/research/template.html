<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<style>
  :root {
    --fg: #1a1a1a;
    --muted: #555;
    --accent: #1d4ed8;
    --rule: #e2e2e2;
    --card-bg: #fff;
    --tldr-bg: #fffbeb;
    --tldr-border: #f59e0b;
    --notfound-bg: #f3f4f6;
    --notfound-border: #9ca3af;
    --unsure-fg: #5b1d1d;
  }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: var(--fg);
    line-height: 1.55;
    max-width: 980px;
    margin: 2.5rem auto;
    padding: 0 1.25rem 4rem;
    background: #fafafa;
  }
  h1 { font-size: 2rem; line-height: 1.2; margin-bottom: 0.25rem; }
  .subtitle { color: var(--muted); font-size: 1.05rem; margin-top: 0; margin-bottom: 1.5rem; }
  h2 {
    font-size: 1.4rem;
    margin-top: 2.75rem;
    margin-bottom: 0.5rem;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 0.35rem;
  }
  h3 { font-size: 1.15rem; margin-top: 1.75rem; }

  a { color: var(--accent); }
  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.88em;
    background: #f1f1f1;
    padding: 0.05em 0.3em;
    border-radius: 3px;
  }

  .intro {
    background: var(--card-bg);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 0.9rem 1.1rem;
    margin: 1rem 0 1.5rem;
    font-size: 0.95rem;
  }

  /* Amber takeaway / aside */
  .takeaway {
    background: var(--tldr-bg);
    border-left: 4px solid var(--tldr-border);
    padding: 0.85rem 1.1rem;
    margin: 1.25rem 0;
    border-radius: 3px;
  }

  /* Grey "no data found" block */
  .not-found {
    background: var(--notfound-bg);
    border-left: 4px solid var(--notfound-border);
    padding: 0.85rem 1.1rem;
    margin: 1.25rem 0;
    border-radius: 3px;
    font-size: 0.95rem;
  }
  .not-found h3 { margin-top: 0; }

  /* Tables */
  table {
    border-collapse: collapse;
    width: 100%;
    margin: 1rem 0;
    font-size: 0.9rem;
  }
  th, td {
    text-align: left;
    padding: 0.45rem 0.55rem;
    border-bottom: 1px solid var(--rule);
    vertical-align: top;
  }
  th { background: #f3f4f6; font-weight: 600; }

  /* Sortable column headers */
  table.sortable th { cursor: pointer; user-select: none; white-space: nowrap; }
  table.sortable th::after { content: " ⇅"; opacity: 0.3; font-size: 0.85em; }
  table.sortable th[data-sort="asc"]::after { content: " ▲"; opacity: 0.85; }
  table.sortable th[data-sort="desc"]::after { content: " ▼"; opacity: 0.85; }

  /* Flash a row when its anchor becomes the URL target, then fade */
  @keyframes row-flash-fade { from { background: #fef9c3; } to { background: transparent; } }
  tr.row-flash td { animation: row-flash-fade 3s ease-out forwards; }
  tr.row-flash td:first-child { font-weight: 700; }

  /* Tint rows with unsure / ❓ claims when they appear in tables */
  tr.row-unsure td { color: var(--unsure-fg); }

  /* Inline overdue date marker */
  .date.overdue { color: #b91c1c; font-weight: 600; }

  footer {
    margin-top: 3rem;
    color: var(--muted);
    font-size: 0.85rem;
    border-top: 1px solid var(--rule);
    padding-top: 1rem;
  }
</style>
<script>
  // Flash the targeted row when arriving via #anchor.
  function flashTargetRow() {
    const id = location.hash.slice(1);
    if (!id) return;
    const el = document.getElementById(id);
    if (!el || el.tagName !== 'TR') return;
    el.classList.remove('row-flash');
    void el.offsetWidth;
    el.classList.add('row-flash');
    setTimeout(() => el.classList.remove('row-flash'), 3000);
  }
  window.addEventListener('hashchange', flashTargetRow);
  window.addEventListener('DOMContentLoaded', flashTargetRow);
  document.addEventListener('click', (e) => {
    const a = e.target.closest('a[href^="#"]');
    if (a && a.getAttribute('href') === location.hash) {
      requestAnimationFrame(flashTargetRow);
    }
  });

  // Sortable tables: click a header to cycle asc → desc → original.
  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('table.sortable').forEach(table => {
      const tbody = table.tBodies[0];
      if (!tbody) return;
      const originalOrder = Array.from(tbody.rows);
      const headers = table.querySelectorAll('thead th');
      headers.forEach((th, colIdx) => {
        th.addEventListener('click', () => {
          const prev = th.getAttribute('data-sort');
          const next = prev === 'asc' ? 'desc' : prev === 'desc' ? null : 'asc';
          headers.forEach(h => h.removeAttribute('data-sort'));
          if (next === null) {
            originalOrder.forEach(r => tbody.appendChild(r));
            return;
          }
          th.setAttribute('data-sort', next);
          const rows = Array.from(tbody.rows);
          const cellText = row => (row.cells[colIdx] ? row.cells[colIdx].textContent : '').trim();
          rows.sort((a, b) => cellText(a).localeCompare(cellText(b), undefined, { numeric: true, sensitivity: 'base' }));
          if (next === 'desc') rows.reverse();
          rows.forEach(r => tbody.appendChild(r));
        });
      });
    });
  });
</script>
