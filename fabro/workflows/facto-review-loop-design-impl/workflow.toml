_version = 1

[workflow]
graph = "workflow.fabro"

# Mirrors the graph goal so `fabro workflow list` shows a description.
# Goal precedence is CLI --goal > [run].goal > graph attribute, so this must
# stay identical to the graph's goal= attribute.
[run]
goal = "Make an implementation's UI/UX match its design: screenshot the mock and the running app, compare them dimension by dimension against a rubric, and run a capped fix loop until they match — falling back to a visual sanity check when no mock exists"
