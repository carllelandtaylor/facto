_version = 1

[workflow]
graph = "workflow.fabro"

# Mirrors the graph goal so `fabro workflow list` shows a description.
# Goal precedence is CLI --goal > [run].goal > graph attribute, so this must
# stay identical to the graph's goal= attribute.
[run]
goal = "Design a feature's UI/UX: produce a design decisions document and a Figma-like design mock covering every screen, transition, state, interaction, copy choice, design-system reference and divergence"
