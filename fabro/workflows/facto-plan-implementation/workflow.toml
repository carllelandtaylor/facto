_version = 1

[workflow]
graph = "workflow.fabro"

# Mirrors the graph goal so `fabro workflow list` shows a description.
# Goal precedence is CLI --goal > [run].goal > graph attribute, so this must
# stay identical to the graph's goal= attribute.
[run]
goal = "Create a detailed technical implementation plan from product requirements, designs and developer input, as a sequence of steps that each keep the system working"
